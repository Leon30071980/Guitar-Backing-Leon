<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guitar Leon · Diagnostica CarPlay</title><style>body{background:#111827;color:#f8fafc;font:16px system-ui;margin:25px auto;max-width:620px;padding:0 20px}h1{font-size:23px}small{color:#aab5c8}.card{background:#030712;border:1px solid #64748b;border-radius:18px;padding:18px;margin:20px 0}.tile{display:grid;place-items:center;margin:auto;width:240px;height:100px;text-align:center;font-weight:900;font-size:28px;border-radius:14px;background:#000}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{padding:10px 16px;background:#d97706;color:#000;font-weight:bold;border:0;border-radius:8px}input{width:100%}a{color:#fbbf24}</style></head><body><h1>Guitar Backing Leon · Diagnostica CarPlay</h1><small>Anteprima senza Google Drive; nessun brano privato viene caricato.</small><div class="card"><div class="tile" id="tile">♪ INTRO STRUMENTALE</div><div class="row"><button id="play">Play</button><button id="pause">Pausa</button><button id="open">Invia al Companion</button></div><input type="range" id="seek" min="0" max="30" step="0.1" value="0"><p id="info">0:00</p></div><p>Questa pagina serve a verificare il formato del collegamento. Il testo e l'orologio sono una simulazione: non dimostrano che CarPlay si aggiornerà in background.</p><script src="./carplay_protocol.js"></script><script>
const words=[{start:3,end:4,text:'LE',line:0},{start:4,end:5,text:'NOTE',line:0},{start:5,end:6,text:'CI',line:0},{start:6,end:7,text:'ACCOMPAGNANO',line:0},{start:11,end:12,text:'IL',line:1},{start:12,end:13,text:'RITMO',line:1},{start:13,end:14,text:'CONTINUA',line:1},{start:18,end:19,text:'UN',line:2},{start:19,end:20,text:'NUOVO',line:2},{start:20,end:21,text:'VERSO',line:2}];
let playing=false,position=0,last=Date.now();const range=document.getElementById('seek');
function state(){return {songId:'test',title:'DEMO ORIGINALE',duration:30,position,playing,offset:0,words};}
function tick(){let now=Date.now();if(playing)position=Math.min(30,position+(now-last)/1000);last=now;range.value=position;const phrases=GuitarCarPlayProtocol.phrases(words);const line=phrases.find(p=>Math.round(position*10)>=p.d-2&&Math.round(position*10)<=p.e+2);document.getElementById('tile').textContent=line?.v.toUpperCase()||'♪ PAUSA MUSICALE';document.getElementById('info').textContent=position.toFixed(1)+' s';requestAnimationFrame(tick);}
document.getElementById('play').onclick=()=>playing=true;document.getElementById('pause').onclick=()=>playing=false;range.oninput=()=>position=Number(range.value);document.getElementById('open').onclick=()=>location.href=GuitarCarPlayProtocol.link(state());tick();
</script></body></html>
